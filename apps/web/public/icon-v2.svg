<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="256" fill="#f5f0eb"/>

  <!--
    Catfish — Picasso line drawing, but unmistakably a fish.
    Wide flat head, whiskers drooping from mouth area,
    body tapers cleanly into a forked tail.
  -->
  <g
    fill="none"
    stroke="#3d2810"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(248, 256)"
  >

    <!-- Upper body — wide flat head flowing into tapered body -->
    <path
      d="M -65 -8
         C -60 -40, -20 -50, 25 -46
         C 60 -42, 95 -28, 118 -6"
      stroke-width="3.2"
    />

    <!-- Lower body — rounder belly, clearly a fish profile -->
    <path
      d="M -65 8
         C -55 42, -5 55, 40 48
         C 72 42, 98 26, 118 6"
      stroke-width="2.8"
    />

    <!-- Flat head connector — the wide catfish snout -->
    <path d="M -65 -8 C -72 -4, -72 4, -65 8" stroke-width="3" />

    <!-- Tail — prominent forked fish tail, no mistaking this -->
    <path d="M 116 -4 C 138 -32, 158 -38, 170 -24" stroke-width="3" />
    <path d="M 116 4 C 138 32, 158 38, 170 24" stroke-width="3" />

    <!-- Dorsal fin — signals "fish" immediately -->
    <path d="M 25 -46 C 35 -72, 60 -68, 70 -42" stroke-width="2.5" />

    <!-- Small ventral fin — reinforces fish shape -->
    <path d="M 50 48 C 55 58, 65 56, 64 46" stroke-width="1.8" />

    <!-- Whiskers — drooping FROM the mouth area, clearly barbels not tentacles -->
    <path d="M -68 2 C -100 -8, -138 -4, -168 -14" stroke-width="3.2" />
    <path d="M -68 6 C -98 14, -135 18, -162 12" stroke-width="2.5" />
    <path d="M -66 9 C -88 28, -118 34, -150 36" stroke-width="1.8" />

    <!-- Eye — bold dot, positioned on the wide head -->
    <circle cx="-35" cy="-6" r="6.5" fill="#3d2810" stroke="none" />

  </g>
</svg>
